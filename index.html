<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기계공학 융합형: 친환경 전기차 효율 시뮬레이터</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 💡 보내주신 apiKey와 URL을 제가 직접 완벽하게 조립해 두었습니다. 수정하지 말고 그대로 쓰세요!
        const firebaseConfig = {
            apiKey: "AIzaSyBEtuO-1WVhgzWuFDUwS8fuZv9Y7nOn-dU", 
            authDomain: "test-700a6.firebaseapp.com",
            databaseURL: "https://test-700a6-default-rtdb.firebaseio.com/",
            projectId: "test-700a6",
            storageBucket: "test-700a6.appspot.com"
        };

        // Firebase 시작
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 데이터 저장 함수
        function saveDataToFirebase() {
            const m = document.getElementById('weight').value;
            const Cd = document.getElementById('cd').value;
            const speed = document.getElementById('speed').value;
            const battery = document.getElementById('battery').value;
            const distance = document.getElementById('resultDistance').innerText;

            // 데이터베이스의 'ev_simulations'라는 방에 저장
            database.ref('ev_simulations').push({
                car_weight_kg: Number(m),
                drag_coefficient_cd: Number(Cd),
                driving_speed_kmh: Number(speed),
                battery_capacity_kwh: Number(battery),
                calculated_distance_km: Number(distance),
                created_at: new Date().toISOString()
            })
            .then(() => {
                alert("🎉 데이터가 Firebase 클라우드 DB에 실시간으로 저장되었습니다!");
            })
            .catch((error) => {
                alert("❌ 저장 실패: " + error.message + "\nFirebase 콘솔 [Rules(규칙)] 탭에서 false를 true로 바꿨는지 확인해 주세요!");
            });
        }
    </script>

    <style>
        :root {
            --primary-color: #00796b;
            --primary-dark: #004d40;
            --accent-color: #e65100;
            --bg-color: #f5f7f8;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 30px 15px;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-top: 0;
            font-size: 1.8rem;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
        }
        .concept-panel {
            background-color: #e0f2f1;
            border-left: 5px solid var(--primary-color);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 30px;
        }
        .panel {
            background: #fafafa;
            padding: 22px;
            border-radius: 10px;
            border: 1px solid #eef0f2;
        }
        .panel h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #444;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }
        .control-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }
        .val-indicator {
            float: right;
            color: var(--primary-color);
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--primary-color);
        }
        .display-box {
            text-align: center;
            padding: 15px 0;
        }
        .distance-output {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-color);
            margin: 10px 0;
        }
        .unit {
            font-size: 1.2rem;
            color: #666;
        }
        .dynamic-analysis {
            font-size: 0.88rem;
            color: #555;
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            border: 1px dashed #ccc;
            line-height: 1.6;
            margin-bottom: 20px;
            min-height: 90px;
        }
        .submit-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 121, 107, 0.2);
        }
        .submit-btn:hover {
            background-color: var(--primary-dark);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔋 기계공학-SW 융합: 친환경 전기차 효율 시뮬레이터</h1>
    
    <div class="concept-panel">
        <strong>[물리학 및 기계공학적 원리]</strong><br>
        • 구름 저항력: Fr = μ · m · g (차량 중량에 비례)<br>
        • 공기 저항력: Fd = 0.5 · ρ · v² · Cd · A (주행 속도의 제곱에 비례)
    </div>

    <div class="main-layout">
        <div class="panel">
            <h3>🛠️ 차량 설계 파라미터 (Input)</h3>
            
            <div class="control-group">
                <label>차량 공차중량 (kg) <span class="val-indicator" id="weightVal">1600</span></label>
                <input type="range" id="weight" min="1000" max="2500" step="50" value="1600" oninput="runSimulation()">
            </div>

            <div class="control-group">
                <label>공기저항계수 (Cd) <span class="val-indicator" id="cdVal">0.26</span></label>
                <input type="range" id="cd" min="0.18" max="0.45" step="0.01" value="0.26" oninput="runSimulation()">
            </div>

            <div class="control-group">
                <label>크루즈 주행 속도 (km/h) <span class="val-indicator" id="speedVal">80</span></label>
                <input type="range" id="speed" min="30" max="150" step="5" value="80" oninput="runSimulation()">
            </div>

            <div class="control-group">
                <label>배터리 팩 용량 (kWh) <span class="val-indicator" id="batteryVal">75</span></label>
                <input type="range" id="battery" min="40" max="100" step="5" value="75" oninput="runSimulation()">
            </div>
        </div>

        <div class="panel">
            <h3>📊 시뮬레이션 결과 (Output)</h3>
            <div class="display-box">
                <p style="margin:0; color:#777;">예상 항속 거리</p>
                <div class="distance-output"><span id="resultDistance">0</span><span class="unit"> km</span></div>
            </div>
            
            <div class="dynamic-analysis" id="analysisBox">
                슬라이더 바를 조작하여 설계 수치를 변경해 보세요.
            </div>

            <button class="submit-btn" onclick="saveDataToFirebase()">💾 클라우드 DB에 설계 저장</button>
        </div>
    </div>
</div>

<script>
function runSimulation() {
    const m = parseFloat(document.getElementById('weight').value);
    const Cd = parseFloat(document.getElementById('cd').value);
    const kmhSpeed = parseFloat(document.getElementById('speed').value);
    const batteryKwh = parseFloat(document.getElementById('battery').value);

    document.getElementById('weightVal').innerText = m;
    document.getElementById('cdVal').innerText = Cd;
    document.getElementById('speedVal').innerText = kmhSpeed;
    document.getElementById('batteryVal').innerText = batteryKwh;

    const g = 9.81; const mu = 0.011; const rho = 1.225; const A = 2.25;
    const v = kmhSpeed / 3.6;

    const Fr = mu * m * g;
    const Fd = 0.5 * rho * (v * v) * Cd * A;
    const F_total = Fr + Fd;

    const totalEnergyJoule = batteryKwh * 3600000;
    const peEfficiency = 0.87; 
    
    const distanceMeter = (totalEnergyJoule * peEfficiency) / F_total;
    const distanceKm = distanceMeter / 1000;

    document.getElementById('resultDistance').innerText = distanceKm.toFixed(0);

    const analysisBox = document.getElementById('analysisBox');
    if (kmhSpeed >= 100) {
        analysisBox.innerHTML = `⚠️ <strong>고속 영역 분석:</strong> 현재 속도(${kmhSpeed}km/h)에서는 공기 저항력이 주된 원인이 됩니다. Cd 감소 설계가 핵심입니다.`;
    } else {
        analysisBox.innerHTML = `🌱 <strong>도심 저속 분석:</strong> 현재 주행 환경에서는 구름 저항력이 큰 비중을 차지합니다. 차량 중량 경량화가 핵심 요인입니다.`;
    }
}
window.onload = runSimulation;
</script>

</body>
</html>
