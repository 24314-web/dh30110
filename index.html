    <title>기계공학 융합형: 친환경 전기차 효율 시뮬레이터</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 💡 보내주신 Firebase 데이터베이스 URL 주소를 기반으로 완성한 설정값입니다.
        const firebaseConfig = {
            // ⚠️ [필수] 본인의 Firebase 콘솔에서 발급받은 실제 apiKey를 아래에 붙여넣어 주세요!
            apiKey: "AIzaSyBEtuO-1WVhgzWuFDUwS8fuZv9Y7nOn-dU", 
            authDomain: "test-700a6.firebaseapp.com",
            databaseURL: "https://test-700a6-default-rtdb.firebaseio.com/", // 👈 보내주신 주소가 적용되었습니다.
            projectId: "test-700a6",
            storageBucket: "test-700a6.appspot.com",
            messagingSenderId: "123456789012", // ⚠️ 본인의 설정값에 맞춰 변경하면 더 좋습니다.
            // ⚠️ [필수] 본인의 Firebase 콘솔에서 발급받은 실제 appId를 아래에 붙여넣어 주세요!
            appId: "1:123456789012:web:abcdef123456" 
        };

        // Firebase 애플리케이션 및 실시간 데이터베이스 초기화
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // 클라우드 저장 기능을 전역 함수로 등록
        window.saveDataToFirebase = function() {
            const m = document.getElementById('weight').value;
            const Cd = document.getElementById('cd').value;
            const speed = document.getElementById('speed').value;
            const battery = document.getElementById('battery').value;
            const distance = document.getElementById('resultDistance').innerText;

            if (distance === "0" || !distance) {
                alert("시뮬레이션을 먼저 진행해 주세요.");
                return;
            }

            // 'ev_simulations' 경로에 시뮬레이션 결과 데이터 전송
            push(ref(database, 'ev_simulations'), {
                car_weight_kg: Number(m),
                drag_coefficient_cd: Number(Cd),
                driving_speed_kmh: Number(speed),
                battery_capacity_kwh: Number(battery),
                calculated_distance_km: Number(distance),
                created_at: new Date().toISOString()
            })
            .then(() => {
                alert("🎉 기계공학 데이터가 Firebase 실시간 DB에 성공적으로 저장되었습니다!");
            })
            .catch((error) => {
                alert("❌ 저장 실패: " + error.message + "\nFirebase 데이터베이스의 [규칙] 탭에서 read와 write가 true로 설정되어 있는지 확인해 주세요.");
            });
        }
    </script>
